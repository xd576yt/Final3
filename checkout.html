<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | Skyfall SMP</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0b1120;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .checkout-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .checkout-box {
      background: #111827;
      padding: 30px;
      border-radius: 14px;
      width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      animation: fadeIn 0.5s ease;
    }

    h2 {
      margin-bottom: 5px;
    }

    .sub {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #020617;
      color: white;
      margin-bottom: 10px;
    }

    input:focus {
      outline: 1px solid #6366f1;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #6366f1;
      padding: 12px;
      border-radius: 8px;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #4f46e5;
    }

    .full {
      width: 100%;
    }

    .secure {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-top: 15px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

</head>
<body>

<div class="checkout-container">

  <div class="checkout-box">
    <h2 id="planTitle">Loading...</h2>
    <p class="sub">Secure checkout • You will be redirected</p>

    <form>
      <label>Email</label>
      <input type="email" placeholder="you@example.com" required>

      <label>Name</label>
      <input type="text" placeholder="Full Name">

      <button type="button" onclick="pay()" class="btn full">
        Continue to Payment
      </button>
    </form>

    <p class="secure">🔒 Payments handled securely on external page</p>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const plan = params.get("plan");

const plans = {
  basic: { name: "Basic - $5", link: "https://buy.stripe.com/test_aFa5kC4Pl4Q94fE67ubQY01" },
  pro: { name: "Pro - $10", link: "https://buy.stripe.com/test_dRmdR85Tp5Ud13sfI4bQY02" },
  elite: { name: "Elite - $20", link: "https://buy.stripe.com/test_5kQ6oG6Xtbex8vUgM8bQY03" }
};

document.getElementById("planTitle").innerText = plans[plan]?.name || "Plan";

function pay(){
  window.location.href = plans[plan].link;
}
</script>

</body>
</html>
