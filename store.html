<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support Skyfall SMP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="checkout-container">

  <div class="checkout-box">

    <h2 id="planTitle">Support</h2>
    <p class="sub">You're supporting the Skyfall SMP server ❤️</p>

    <form onsubmit="return donate()">

      <label>Minecraft Username</label>
      <input type="text" placeholder="Your username">

      <label>Message (optional)</label>
      <input type="text" placeholder="Say something nice!">

      <label>Would you like to support the server?</label>
      <select id="donationChoice">
        <option value="yes">Yes ❤️</option>
        <option value="no">Not right now</option>
      </select>

      <button class="btn full">Continue</button>

    </form>

    <p id="thanks" style="display:none;">Thank you for supporting the server ❤️</p>

  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const plan = params.get("plan");

const plans = {
  basic: { name: "Basic Support - $5", link: "https://YOUR_DONATION_LINK" },
  pro: { name: "Pro Support - $10", link: "https://YOUR_DONATION_LINK" },
  elite: { name: "Elite Support - $20", link: "https://YOUR_DONATION_LINK" }
};

document.getElementById("planTitle").innerText = plans[plan]?.name || "Support";

function donate(){
  const choice = document.getElementById("donationChoice").value;

  if(choice === "yes"){
    window.location.href = plans[plan].link;
  } else {
    document.getElementById("thanks").style.display = "block";
  }

  return false;
}
</script>

</body>
</html>
