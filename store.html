<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skyfall SMP Store</title>

<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0b1120;
    color: #e5e7eb;
  }

  .plans {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 80px 20px;
    flex-wrap: wrap;
  }

  .card {
    background: #111827;
    width: 260px;
    padding: 25px;
    border-radius: 14px;
    text-align: center;
    transition: 0.25s ease;
    border: 1px solid transparent;
  }

  .card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    border-color: #6366f1;
  }

  .card h2 {
    margin-bottom: 10px;
  }

  .card p {
    margin: 5px 0;
  }

  .desc {
    color: #9ca3af;
    font-size: 14px;
    margin-bottom: 15px;
  }

  .featured {
    border: 2px solid #6366f1;
    transform: scale(1.05);
  }

  .featured:hover {
    transform: scale(1.05) translateY(-8px);
  }

  .btn {
    display: inline-block;
    margin-top: 10px;
    padding: 12px 18px;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    text-decoration: none;
    transition: 0.2s;
    width: 100%;
  }

  .btn:hover {
    background: #4f46e5;
  }

  /* small title styling if used alone */
  h1 {
    text-align: center;
    padding-top: 40px;
  }
</style>

</head>
<body>

<h1>Support Skyfall SMP</h1>

<section class="plans">

  <div class="card">
    <h2>Basic Support</h2>
    <p>$5</p>
    <p class="desc">1,000 Coins every minute you play</p>
    <a href="checkout.html?plan=basic" class="btn">Continue</a>
  </div>

  <div class="card featured">
    <h2>Pro Support</h2>
    <p>$10</p>
    <p class="desc">4,000 Coins every minute you play, Custom name bar</p>
    <a href="checkout.html?plan=pro" class="btn">Continue</a>
  </div>

  <div class="card">
    <h2>Elite Support</h2>
    <p>$20</p>
    <p class="desc">Maximum support tier</p>
    <a href="checkout.html?plan=elite" class="btn">Continue</a>
  </div>

</section>

</body>
</html>
